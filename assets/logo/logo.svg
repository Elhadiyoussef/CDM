<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7A5A"/>
      <stop offset="1" stop-color="#053B2A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2D27A"/>
      <stop offset="1" stop-color="#C9A24B"/>
    </linearGradient>
    <clipPath id="above"><rect x="0" y="0" width="1024" height="640"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <!-- soleil levant (la retraite) -->
  <g clip-path="url(#above)">
    <circle cx="512" cy="640" r="250" fill="url(#gold)"/>
    <g stroke="#E6C46A" stroke-width="26" stroke-linecap="round" opacity="0.9">
      <line x1="512" y1="330" x2="512" y2="270"/>
      <line x1="292" y1="420" x2="250" y2="378"/>
      <line x1="732" y1="420" x2="774" y2="378"/>
      <line x1="202" y1="610" x2="142" y2="610"/>
      <line x1="822" y1="610" x2="882" y2="610"/>
    </g>
  </g>
  <!-- barres de croissance (l'épargne) -->
  <g fill="#FFFFFF">
    <rect x="352" y="560" width="76" height="80" rx="14"/>
    <rect x="474" y="500" width="76" height="140" rx="14"/>
    <rect x="596" y="430" width="76" height="210" rx="14"/>
  </g>
  <!-- horizon -->
  <rect x="170" y="664" width="684" height="34" rx="17" fill="#FFFFFF"/>
  <rect x="270" y="734" width="484" height="22" rx="11" fill="#FFFFFF" opacity="0.55"/>
</svg>
